name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurer
        run: dotnet restore MordheimLedgerApp.Tests/MordheimLedgerApp.Tests.csproj

      - name: Tests
        run: dotnet test MordheimLedgerApp.Tests/MordheimLedgerApp.Tests.csproj --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: MordheimLedgerApp.Tests/TestResults/*.trx
          if-no-files-found: ignore

  build-windows:
    name: Build Windows (appli MAUI)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Workload MAUI
        run: dotnet workload install maui

      - name: Build Windows
        run: dotnet build MordheimLedgerApp/MordheimLedgerApp.csproj -f net10.0-windows10.0.19041.0 -c Debug

  # Stryker sur les services Core de la Fin de partie (MordheimLedgerApp.Tests/stryker-config.json).
  # Sur une PR : seulement les fichiers modifiés par rapport à la branche cible (--since).
  # Lancement manuel (workflow_dispatch) : passe complète (~30 min). Casse sous 80 %.
  mutation:
    name: Mutation (Stryker)
    needs: tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: MordheimLedgerApp.Tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --since compare avec la branche cible

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Installer Stryker
        run: dotnet tool install -g dotnet-stryker --version 5.1.0

      - name: Stryker
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SINCE="--since:origin/${{ github.base_ref }}"
          fi
          dotnet stryker $SINCE -r markdown -r html -r progress

      - name: Résumé
        if: always()
        run: |
          REPORT=$(find StrykerOutput -name 'mutation-report.md' | head -1)
          if [ -n "$REPORT" ]; then
            grep -v -F 'N\/A' "$REPORT" >> "$GITHUB_STEP_SUMMARY" # fichiers non mutés retirés
          else
            echo "Aucun rapport : aucun fichier muté n'a changé, ou Stryker n'a pas pu s'exécuter." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-mutation
          path: MordheimLedgerApp.Tests/StrykerOutput/**/reports/
          if-no-files-found: ignore
