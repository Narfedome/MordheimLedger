# Relais « Nous écrire » - voir README.md pour le déploiement.
name = "feedback-relay"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "A_REMPLACER_PAR_L_ID_DU_NAMESPACE"   # wrangler kv namespace create FEEDBACK_KV

[vars]
SUPPORT_REPO = "Narfedome/support"
APP_KEYS = "mordheim-ledger=mordheim,resonance=resonance"
RATE_LIMIT_PER_HOUR = "5"
# SUPPORT_EMAIL = "votre adresse"                                  # alerte à chaque nouveau ticket
# MAIL_FROM = "Mordheim Ledger <support@mordheimledger.com>"       # domaine vérifié chez Resend

# Secrets (jamais ici) : wrangler secret put GITHUB_TOKEN / RELEASE_TOKEN / RESEND_API_KEY
