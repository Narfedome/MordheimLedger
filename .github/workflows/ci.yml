name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurer
        run: dotnet restore MordheimLedgerApp.Tests/MordheimLedgerApp.Tests.csproj

      - name: Tests
        run: dotnet test MordheimLedgerApp.Tests/MordheimLedgerApp.Tests.csproj --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: MordheimLedgerApp.Tests/TestResults/*.trx
          if-no-files-found: ignore

  build-windows:
    name: Build Windows (appli MAUI)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Workload MAUI
        run: dotnet workload install maui

      - name: Build Windows
        run: dotnet build MordheimLedgerApp/MordheimLedgerApp.csproj -f net10.0-windows10.0.19041.0 -c Debug
